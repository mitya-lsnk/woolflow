# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Hermes Agent on Render — Free tier (frankfurt), dashboard OFF by default.
#
# A tiny in-container port stub (see Dockerfile) keeps the healthcheck green;
# Hermes itself talks to Telegram over an outbound long-poll. The Free instance
# has NO persistent disk, so set all secrets in the Render Dashboard Environment
# tab (they survive spin-downs); anything written under /opt/data is lost on
# redeploy/restart.
#
# Everything under "memory profile" below is read at boot by
# scripts/boot-config.py, so retuning the 512 MB budget is a Restart, not a
# rebuild. Watch the effect in the logs: the port stub prints
# `[woolflow] mem used=...MiB limit=512MiB (..%)` on the interval set here.
services:
- type: web
  name: woolflow
  runtime: docker
  region: frankfurt
  plan: free
  dockerfilePath: ./Dockerfile
  autoDeployTrigger: off
  # The stub answers 200 on "/", which is what Render probes.
  healthCheckPath: /
  envVars:
  # Gateway token, generated once at first deploy. Reuse as API_SERVER_KEY if
  # you later enable the OpenAI-compatible API server.
  - key: HERMES_GATEWAY_TOKEN
    generateValue: true
  # Dashboard OFF by default: it is a second Python process (~80-120 MB) and
  # does not fit alongside the gateway in 512 MB.
  # To configure via browser: set HERMES_DASHBOARD=1 in the Render Dashboard
  # Environment tab, click Restart, finish setup, then set it back to 0.
  - key: HERMES_DASHBOARD
    value: "0"
  # Telegram chat (outbound long-poll — no open port needed for messaging).
  - key: TELEGRAM_BOT_TOKEN
    sync: false
  # LLM provider key. OpenRouter is the easiest single key for most models.
  # Set it in the Render Dashboard Environment tab so it survives spin-downs.
  - key: OPENROUTER_API_KEY
    sync: false

  # ---- Scheduled jobs ----
  # Jobs live in cron/jobs.yaml and are re-created on every boot; Free wipes
  # $HERMES_HOME/cron/jobs.json on each spin-down. 0 installs none.
  - key: WOOLFLOW_CRON
    value: "1"
  # Where deliver="telegram" lands. Get it from @userinfobot and set it here —
  # it is personal data, so it stays out of the repo. Without it a job still
  # runs and its output is only saved inside the container.
  - key: WOOLFLOW_TELEGRAM_CHAT_ID
    sync: false
  # Cron schedules follow THIS, not the server clock. Render runs UTC, so
  # leaving it unset makes "every day at 9am" fire at 9am UTC.
  - key: HERMES_TIMEZONE
    value: "UTC"

  # ---- Model ----
  # The gateway treats config.yaml as the single source of truth for the model
  # and config.yaml does not survive a rebuild, so a model chosen with /model
  # reverts to Hermes' stock Anthropic default on the next deploy. Pin it here.
  # Leave empty to keep using /model and accept that it resets.
  - key: WOOLFLOW_MODEL
    value: "thinkingmachines/inkling:free"
  # Only needed when the model is not reachable through the configured
  # OpenRouter key — e.g. "nvidia" for build.nvidia.com with NVIDIA_API_KEY.
  - key: WOOLFLOW_MODEL_PROVIDER
    sync: false

  # ---- How much he remembers ----
  # Chars of the memory store replayed into the prompt each turn. Hermes ships
  # 2200 / 1375 — a page, sized for an assistant's operational facts, not for a
  # companion. Disk is not the constraint (memories/ is just files) and neither
  # is RAM; this is paid in context tokens on every turn, which prompt caching
  # makes cheap after the first call. Roughly 2.75 chars per token.
  - key: WOOLFLOW_MEMORY_CHARS
    value: "6000"
  - key: WOOLFLOW_USER_MEMORY_CHARS
    value: "3000"

  # ---- Memory profile (512 MB Free) ----
  # Seconds between `[woolflow] mem used=...` lines from the port stub. This is
  # the only view of real memory use on Free, which has no metrics page. Set to
  # 0 to silence it once you trust the numbers.
  - key: WOOLFLOW_MEM_INTERVAL
    value: "120"
  # Hard cap on simultaneously active chats. Each one holds a live agent, its
  # transcript and its tool state in memory.
  - key: WOOLFLOW_MAX_CONCURRENT_SESSIONS
    value: "1"
  # LRU cap on cached-but-detached sessions. Hermes' own default is 16;
  # reopening an evicted session just re-resumes it from disk.
  - key: WOOLFLOW_MAX_LIVE_SESSIONS
    value: "2"
  # ---- Identity and environment ----
  # SOUL.md (the agent's persona) is baked into the image at soul/SOUL.md and
  # reinstalled on every boot — Free has no disk, so Hermes would otherwise
  # reseed the stock persona each wake-up. Edit soul/SOUL.md and redeploy.
  #   0     = leave whatever Hermes seeded
  #   force = overwrite even a hand-edited SOUL.md
  - key: WOOLFLOW_SOUL
    value: "1"
  # Strips Hermes' assistant framing out of the system prompt: the first-contact
  # "introduce yourself and mention /help" + profile-build offer, the
  # finishing-the-job and verification briefs, the tool-batching guidance, and
  # the Python/pip environment probe (an outright anachronism leak). 0 restores
  # Hermes' defaults. See scripts/boot-config.py for what each one costs.
  - key: WOOLFLOW_PERSONA
    value: "1"
  # Runtime facts, kept OUT of SOUL.md on purpose: upstream provides this slot
  # precisely so a host can describe the environment without editing the
  # identity. It overrides agent.environment_hint and lands in the cached part
  # of the system prompt, so changing it costs a Restart and no rebuild.
  #
  # Deliberately short and free of modern nouns. The agent is a period roleplay
  # character with no tools at all, so there is almost nothing true left to say
  # — and every word here is a word that could leak into his mouth.
  - key: HERMES_ENVIRONMENT_HINT
    value: >-
      Ты отвечаешь в переписке. Ничего, кроме ответа, ты сделать не можешь:
      средств действовать вовне у тебя нет, и между разговорами ничего не
      сохраняется. Это служебные сведения — никогда не проговаривай их, не
      называй понятий, которых нет в мире персонажа, и не выходи ради них из
      образа. Если у тебя просят что-то сделать, ты просто не понимаешь, о чём
      речь.

  # Toolsets stripped from every agent's schema. These 23 cover every tool in
  # Hermes' core set except `memory`, which stays as his only durable notebook
  # (it writes to memories/ and returns in the prompt later). That is what makes
  # the character effectively toolless (he cannot
  # offer or run anything, so he never has to explain why he won't) and, at the
  # same time, what removes every remaining OOM risk: `browser` is Playwright's
  # 150-400 MB Chromium, and `terminal` / `code_execution` let the agent run
  # anything at all inside a 512 MB cgroup.
  # Inbound Telegram photos still reach the model — image input is a separate
  # path from the vision toolset.
  - key: WOOLFLOW_DISABLED_TOOLSETS
    value: "browser,computer_use,terminal,code_execution,delegation,file,web,search,x_search,skills,cronjob,todo,clarify,session_search,context_engine,project,vision,video,video_gen,image_gen,tts,homeassistant,kanban"
